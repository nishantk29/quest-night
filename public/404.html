<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found | Quest Night</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0B0B0D">
<style>html{background:#0B0B0D;color-scheme:dark}</style>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/redesign.css">
<style>.err-page{min-height:100svh;display:grid;align-content:center}
.err-mark{display:block;text-align:center;font-family:var(--display-serif);font-size:var(--fs-lg);letter-spacing:.06em;color:var(--brass);padding-top:var(--s5)}
.err-page .empty{gap:var(--s4);justify-items:center;text-align:center}
@media (prefers-reduced-motion:no-preference){.err-page .empty>*{animation:err-rise 280ms var(--ease-out) both}.err-page .empty>:nth-child(2){animation-delay:40ms}.err-page .empty>:nth-child(3){animation-delay:80ms}}
@keyframes err-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}</style>
</head>
<body>
<div class="err-mark" aria-hidden="true">Quest Night</div>
<main class="wrap fatal ended err-page"><div class="empty"><h1 class="err-title">Page not found</h1><p class="muted">The page you wanted isn’t here. Head back to the games.</p><div class="err-actions"><a class="btn big" href="https://gamenight.hatethespurs.com">Go to Game Night home</a><a class="err-link" href="/">Back to Quest Night home</a></div></div></main>
</body>
</html>
